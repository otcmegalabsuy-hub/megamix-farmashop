<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MEGA MIX Farmashop</title>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Montserrat:wght@500..900&display=swap">
<style>
:root{
  --or-hi:#FFD27A; --or-1:#FFA229; --or-2:#F57A1F; --or-3:#DA530F; --or-ink:#E35A12;
  --navy:#0E2F6E; --navy-2:#1A4596; --blue:#1B54B5; --gold:#F7B52A; --white:#FFFFFF; --paper:#FFF7EE;
  --navy-0:#0E2F6E;
  --text:#FFFFFF; --muted:rgba(255,255,255,.88); --line:rgba(255,255,255,.45);
  --ink:#0E2F6E; --ink-soft:#4A5E86; --rule:rgba(14,47,110,.14);
  --dha:#FFFFFF; --dha-ink:#1B54B5; --epa:#0E2F6E; --epa-ink:#F7B52A;
  --good:#12844A; --warn:#DA530F;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--or-2);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
#root{height:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

.app{position:relative;min-height:100vh;min-height:100dvh;overflow:visible;
  background:
    repeating-radial-gradient(circle at 50% 36%,rgba(255,255,255,0) 0 46px,rgba(255,255,255,.07) 47px 49px,rgba(255,255,255,0) 50px 96px),
    radial-gradient(circle at 50% 36%,var(--or-hi) 0,var(--or-1) 20%,var(--or-2) 48%,var(--or-3) 100%);}
.app.playing{height:100vh;height:100dvh;overflow:hidden}
.app.playing .shell{height:100vh;height:100dvh;min-height:0}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particles i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(20px)}to{transform:translateY(-120vh)}}
.shell{position:relative;z-index:1;min-height:100vh;min-height:100dvh;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:10px}

/* marca tipográfica provisional */
.brand{display:inline-flex;align-items:baseline;gap:5px;padding:5px 14px 4px;border-radius:999px;background:#fff;box-shadow:0 4px 14px rgba(120,40,0,.25);font-family:var(--display);font-weight:900;line-height:1;text-transform:uppercase;justify-self:start;align-self:center}
.brand .m{color:var(--or-ink);font-size:21px;letter-spacing:.01em}
.brand .o{color:#F08A3A;font-size:15px;font-weight:800;letter-spacing:.03em}
.brand .t{color:var(--or-ink);font-size:23px}
.brand img{height:39px;width:auto;display:block}
.brand.brand-md{padding:8px 16px}
.brand.brand-md img{height:58px}
.brand.brand-lg{padding:10px 20px}
.brand.brand-lg img{height:78px}

/* fichas */
.chip{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9;font-family:var(--display);flex:none;position:relative;user-select:none;font-style:italic}
.chip.DHA{background:radial-gradient(circle at 34% 28%,#fff 0,#fff 45%,#DDE8FA 100%);color:var(--blue);box-shadow:0 0 0 3px var(--blue) inset,0 0 0 5px #fff inset,0 6px 14px rgba(90,30,0,.35)}
.chip.EPA{background:radial-gradient(circle at 34% 28%,#2A5BB8 0,var(--navy) 55%,#081E4A 100%);color:var(--gold);box-shadow:0 0 0 3px var(--gold) inset,0 6px 14px rgba(90,30,0,.4)}
.chip b{font-weight:900;letter-spacing:.01em}
.chip small{font-weight:800;font-family:var(--display);margin-top:1px;letter-spacing:.02em}
.chip.EPA small{color:#fff}

/* botones */
.btn{appearance:none;border:2px solid #fff;border-radius:999px;min-height:58px;padding:0 34px;font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 10px 24px rgba(80,25,0,.35);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(80,25,0,.42)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--navy);border-color:#fff}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--navy);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(120,40,0,.25)}
.icon-btn:disabled{opacity:.6}
.icon-btn svg{width:20px;height:20px}

/* pantallas */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;gap:16px;padding-block:12px}
.game-title{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(76px,22vw,136px);line-height:.82;margin:0;letter-spacing:-.01em;color:#fff;text-transform:uppercase;
  text-shadow:0 4px 0 rgba(170,60,0,.35),0 12px 30px rgba(120,40,0,.35)}
.claim{margin:0;display:inline-block;max-width:100%;padding:9px 20px;border-radius:12px;background:var(--navy);color:#fff;font-family:var(--body);font-weight:800;font-size:clamp(13px,3.6vw,17px);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;box-shadow:0 6px 16px rgba(80,25,0,.3)}
.claim .hl{color:var(--gold)}
.pill-white{display:inline-block;text-transform:uppercase;letter-spacing:.01em;max-width:100%;margin:0;padding:8px 18px;border-radius:999px;background:#fff;color:var(--navy);font-weight:800;font-size:clamp(14px,3.9vw,17px);text-wrap:balance;box-shadow:0 6px 16px rgba(120,40,0,.25)}
.lead{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.muted{color:var(--muted)}
.recipe{display:grid;gap:8px;width:min(100%,420px);padding:14px 18px 18px;border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 12px 30px rgba(110,35,0,.3)}
.recipe-head{margin:0;text-align:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;line-height:1.05;text-wrap:balance;text-transform:uppercase;color:var(--navy);letter-spacing:.01em}
.mix-row{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,4vw,22px)}
.mix-item{display:grid;justify-items:center;gap:6px}
.mix-mg{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;color:var(--blue);line-height:1;text-transform:uppercase}
.mix-plus{font-family:var(--display);font-weight:900;font-size:34px;color:var(--navy);line-height:1;padding-bottom:22px}
.hint-ctrl{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff}
kbd{font-family:var(--body);font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;background:#fff;color:var(--navy)}
.fineprint{font-size:11px;color:rgba(255,255,255,.85)}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.hud-actions{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 14px;border-radius:14px;background:var(--navy);box-shadow:0 6px 14px rgba(80,25,0,.25);transition:background .3s}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8);font-weight:800}
.stat strong{font-family:var(--display);font-style:italic;font-weight:900;font-size:36px;font-variant-numeric:tabular-nums;line-height:1.05;color:#fff}
.stat.low{background:#fff}
.stat.low span{color:var(--ink-soft)}
.stat.low strong{color:var(--or-ink);animation:breathe 1s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}

.counters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.counter{padding:9px 12px;border-radius:14px;background:#fff;color:var(--ink);display:grid;gap:6px;box-shadow:0 6px 14px rgba(80,25,0,.22);border:2px solid transparent;transition:border-color .3s,background .3s}
.counter.done.DHA{border-color:var(--blue);background:#EEF4FF}
.counter.done.EPA{border-color:var(--gold);background:#FFF6E0}
.counter-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tag{font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;letter-spacing:.02em;padding:1px 11px;border-radius:999px;line-height:1.3}
.tag.DHA{background:var(--blue);color:#fff}
.tag.EPA{background:var(--navy);color:var(--gold)}
.slots{display:flex;gap:3px}
.slot{width:11px;height:11px;border-radius:50%;border:2px dashed rgba(14,47,110,.3);transition:background .25s,border-color .25s}
.slot.on.DHA{background:var(--blue);border:2px solid var(--blue)}
.slot.on.EPA{background:var(--gold);border:2px solid var(--navy)}
.mg{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;font-variant-numeric:tabular-nums;line-height:.95;color:var(--navy)}
.mg em{font-style:normal;font-size:15px;color:var(--ink-soft);font-weight:700}
.bar{height:7px;border-radius:7px;background:rgba(14,47,110,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.DHA i{background:var(--blue)} .bar.EPA i{background:linear-gradient(90deg,var(--or-2),var(--gold))}
.done-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--good);animation:popin .35s ease}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* campo */
.field{position:relative;flex:1;min-height:300px;border-radius:22px;overflow:hidden;touch-action:none;overscroll-behavior:contain;cursor:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.22),rgba(255,255,255,.06) 60%),rgba(200,70,0,.12);border:2px solid rgba(255,255,255,.6);box-shadow:inset 0 0 40px rgba(255,255,255,.12)}
.field::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(255,255,255,.1) calc(20% - 1px) 20%);pointer-events:none}
.ent{position:absolute;left:0;top:0;will-change:transform}
.basket{position:absolute;left:0;bottom:16px;will-change:transform}
.capsule{position:absolute;inset:0}
.capsule img{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.capsule .cap-empty{opacity:.42;filter:saturate(.35) brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.95)) drop-shadow(0 6px 10px rgba(100,30,0,.3))}
.capsule .cap-fill{position:absolute;inset:0;transition:clip-path .35s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 10px rgba(255,220,120,.9))}
.capsule .cap-outline{position:absolute;inset:0;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 0 16px rgba(255,255,255,.55)}
.basket-label{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(14,47,110,.95),0 0 8px rgba(14,47,110,.6);white-space:nowrap}
.basket-pop{position:absolute;inset:-6px;border-radius:999px;border:3px solid var(--pop,#fff);animation:pop .45s ease-out forwards;pointer-events:none}
@keyframes pop{from{opacity:.95;transform:scale(1)}to{opacity:0;transform:scale(1.2)}}
.toast{position:absolute;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);top:38%;padding:10px 18px;border-radius:999px;background:#fff;color:var(--navy);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 8px 20px rgba(80,25,0,.35);animation:popin .2s ease;pointer-events:none}
.float-pts{position:absolute;white-space:nowrap;font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(14,47,110,.7);animation:rise .8s ease-out forwards}
@keyframes rise{to{transform:translateY(-44px);opacity:0}}
.guide{min-height:28px;text-align:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(120,40,0,.35)}
.guide .DHA-t,.guide .EPA-t{display:inline-block;padding:0 9px;border-radius:999px;font-family:var(--display);font-style:italic;font-weight:900;font-size:18px;text-shadow:none}
.guide .DHA-t{background:#fff;color:var(--blue)} .guide .EPA-t{background:var(--navy);color:var(--gold)}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,47,110,.55);backdrop-filter:blur(3px);z-index:5;text-align:center}
.count{font-family:var(--display);font-style:italic;font-weight:900;font-size:150px;line-height:1;color:#fff;animation:countin .9s ease both}
@keyframes countin{from{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}to{opacity:.2}}
.pause-card{display:grid;gap:12px;padding:24px;justify-items:center}
.pause-card h2{font-family:var(--display);font-style:italic;font-weight:900;font-size:52px;margin:0;text-transform:uppercase}

/* sello del evento: Farmashop · Feria de Embajadores */
.event{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:6px 6px 6px 14px;border-radius:999px;background:#fff;box-shadow:0 6px 16px rgba(120,40,0,.28)}
.event img{height:36px;width:auto;max-width:none;display:block;flex:none}
.event span{min-width:0;font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;text-align:center;padding:8px 12px 7px;border-radius:999px;background:var(--navy);color:#fff}
.event.sm img{height:28px}
.event.sm span{font-size:14px;padding:6px 10px 5px}
.thanks{margin:0;font-weight:800;font-size:clamp(14px,4vw,17px);color:#fff;text-wrap:balance;text-shadow:0 1px 3px rgba(120,40,0,.35)}
@media (max-width:360px){.event img{height:30px}.event span{font-size:15px}}

/* cartel de componente completo */
.badge-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:76%;max-width:420px;
  display:flex;flex-direction:column;align-items:stretch;text-align:center;border-radius:20px;overflow:hidden;
  box-shadow:0 18px 44px rgba(80,25,0,.5);animation:badgepop 2.2s cubic-bezier(.2,1.3,.4,1) forwards;pointer-events:none}
@keyframes badgepop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.97)}}
.badge-pop .bp-chip{display:grid;place-items:center;padding:14px;background:#fff}
.badge-pop .bp-body{display:grid;justify-items:center;gap:6px;padding:14px 16px 6px;background:var(--navy);color:#fff}
.badge-pop .bp-title{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(17px,5.2vw,26px);line-height:1;text-transform:uppercase;max-width:100%;overflow-wrap:break-word}
.badge-pop .bp-claim{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(22px,7vw,36px);line-height:1.02;color:var(--gold);text-wrap:balance;max-width:100%;overflow-wrap:break-word}
.badge-pop .bp-foot{font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
.badge-pop .bp-icon{display:grid;place-items:center;padding:4px 0 16px;background:var(--navy)}
.badge-pop .bp-icon-svg svg{width:64px;height:64px;color:#fff;stroke-width:1.5}
.badge-pop .bp-icon img{width:64px;height:auto;flex:none;filter:drop-shadow(0 0 10px rgba(255,255,255,.4))}
.badge-pop.big{width:90%;max-width:500px}
.badge-pop.big .bp-chip{padding:10px 14px 6px;background:#fff}
.badge-pop.big .bp-chip img{width:74%;max-width:260px;height:auto}
.badge-pop.big .bp-claim{font-size:clamp(26px,8.4vw,42px)}
.badge-pop.big .bp-heart img{width:auto;height:96px;filter:drop-shadow(0 0 12px rgba(255,255,255,.45))}
.badge-pop .bp-edge{height:10px;background:linear-gradient(90deg,var(--or-1),var(--or-3))}
.freeze-tint{position:absolute;inset:0;background:rgba(14,47,110,.22);z-index:3;pointer-events:none}

/* impurezas */
.impurity{position:relative;flex:none;filter:drop-shadow(0 5px 9px rgba(40,30,10,.45))}
.impurity svg{display:block}
.splash{border-radius:50%;background:radial-gradient(circle,rgba(120,110,90,.85) 0,rgba(90,82,66,.5) 45%,rgba(90,82,66,0) 70%);animation:splash .5s ease-out forwards}
@keyframes splash{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
.capsule.shake{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-5px) rotate(-2deg)}50%{transform:translateX(4px) rotate(1.5deg)}75%{transform:translateX(-2px)}}
.toast-imp{background:#3B3527;color:#FFE9C4;border:2px solid #A79462}
.imp-hint{display:inline-flex;align-items:center;gap:10px;padding:4px 16px 4px 6px;border-radius:999px;background:#3B3527;color:#FFE9C4;font-weight:800;font-size:14px;text-align:left;box-shadow:0 6px 16px rgba(80,25,0,.3)}

/* resultado */
.emblem-stage{position:relative;width:230px;height:230px;flex:none}
.emblem-stage .fly{position:absolute;left:50%;top:50%;animation:fly 1s cubic-bezier(.5,0,.2,1) both}
@keyframes fly{from{transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) scale(1)}80%{opacity:1}to{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.emblem{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--blue) 0 40%,var(--gold) 40% 100%);display:grid;place-items:center;
  box-shadow:0 0 0 5px #fff,0 0 60px rgba(255,240,200,.9),0 14px 30px rgba(100,30,0,.35);animation:emblem .6s .85s cubic-bezier(.2,1.4,.4,1) both}
.emblem::before{content:"";position:absolute;inset:17px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#FFEBD3)}
.emblem div{position:relative;display:grid;line-height:.9}
.emblem strong{font-family:var(--display);font-weight:900;font-size:38px;line-height:.9;color:var(--or-ink);text-transform:uppercase}
.emblem strong em{display:block;font-style:normal;font-size:26px;letter-spacing:.01em}
.emblem .em-logo{width:156px;height:auto;margin:0 auto;display:block}
.emblem span{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--navy);margin-top:8px;line-height:1}
.emblem span i{font-style:normal;color:var(--or-ink);font-weight:900}
.emblem span u{text-decoration:none;display:grid;font-size:15px}
.emblem span u small{font-size:11px;letter-spacing:.06em;color:var(--ink-soft)}
@keyframes emblem{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.reveal{animation:fadeup .5s 1.2s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:28%;left:50%;width:8px;height:14px;border-radius:2px;animation:burst 1.6s 1s cubic-bezier(.1,.7,.3,1) both}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--cx),var(--cy)) rotate(var(--cr));opacity:0}}
.h-result{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(44px,12vw,68px);line-height:.9;margin:0;text-wrap:balance;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(170,60,0,.35)}
.formula{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(24px,7vw,32px);line-height:1.1}
.formula .d,.formula .e{padding:2px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(80,25,0,.25)}
.formula .d{background:#fff;color:var(--blue)} .formula .e{background:var(--navy);color:var(--gold)}
.total{margin:0;font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase}
.score-table{width:min(100%,420px);border-radius:16px;background:#fff;color:var(--ink);padding:6px 16px;text-align:left;box-shadow:0 12px 30px rgba(110,35,0,.3)}
.score-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.score-row:last-child{border-bottom:0}
.score-row b{font-family:var(--display);font-style:italic;font-weight:900;font-size:22px}
.score-row.sum b{font-size:34px;color:var(--or-ink)}
.note{font-size:12.5px;color:var(--muted);margin:2px 0 6px;font-weight:600}
.quiz{display:grid;gap:10px;width:min(100%,420px)}
.opt{min-height:58px;border-radius:16px;border:3px solid #fff;background:#fff;color:var(--navy);font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 18px;text-align:left;box-shadow:0 6px 16px rgba(80,25,0,.25);transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){transform:translateY(-1px);border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:#E9F8EF;color:var(--good)}
.opt.wrong{border-color:var(--or-3);background:#FFF0E6}
.opt.faded{opacity:.6}
.feedback{font-weight:800;font-size:17px;margin:0;color:#fff}
.big-score{font-family:var(--display);font-style:italic;font-weight:900;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 4px 0 rgba(170,60,0,.35)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.territories{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.territory{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 8px;border-radius:999px;background:var(--navy);color:#fff;font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;text-transform:uppercase}
.territory svg{width:26px;height:26px;padding:4px;border-radius:50%;background:#fff;color:var(--blue)}
.progress-lose{display:grid;gap:10px;width:min(100%,420px)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#fff;margin:0}
.strip{align-self:stretch;margin-inline:-16px;margin-bottom:-12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;text-align:center;font-weight:800;font-size:clamp(12px,3.4vw,16px);text-transform:uppercase;letter-spacing:.02em}
.strip .hl{color:var(--gold)}

@media (max-width:400px){
  .shell{gap:8px;padding-block:8px}
  .stat strong{font-size:30px}
  .mg{font-size:25px}
  .counter{padding:8px 10px}
  .btn{font-size:23px;padding:0 26px}
  .recipe-head{font-size:23px}
  .mix-mg{font-size:18px}
  .screen{gap:12px}
  .strip{margin-bottom:-8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .particles{display:none}
  .emblem-stage .fly{display:none}
}
</style>

const need = (k) => CONFIG.COMPONENTS[k].target;
const mgTotal = (k) => Number(CONFIG.COMPOSITION[k]) || 0;
const mgPerChip = (k) => mgTotal(k) / need(k);
const mgGot = (k, count) => Math.round(Math.min(count, need(k)) * mgPerChip(k));
const TOTAL_CHIPS = CONFIG.ORDER.reduce((s, k) => s + need(k), 0);
const FORMULA = `${need("DHA")} DHA + ${need("EPA")} EPA`;

/* ============ LÓGICA PURA (testeable) ============ */
function newScoreState() {
  return { progress: { DHA: 0, EPA: 0 }, score: 0, penalties: 0, valid: 0 };
}
function isDone(state, k) { return state.progress[k] >= CONFIG.COMPONENTS[k].target; }
function isComplete(state) { return CONFIG.ORDER.every((k) => isDone(state, k)); }
function applyCatch(state, k) {
  if (isDone(state, k)) {
    const lost = Math.min(CONFIG.PENALTY_EXTRA, state.score);
    return { state: { ...state, score: state.score - lost, penalties: state.penalties + lost }, result: "extra", lost };
  }
  const progress = { ...state.progress, [k]: state.progress[k] + 1 };
  const next = { ...state, progress, score: state.score + CONFIG.POINTS_CATCH, valid: state.valid + 1 };
  return { state: next, result: "valid", justDone: isDone(next, k) };
}
function timeBonus(secondsLeft) { return Math.max(0, Math.floor(secondsLeft)) * CONFIG.TIME_BONUS_PER_SEC; }
function shuffle(arr, rand = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function makeBag(rand, withImpurities = CONFIG.IMPURITIES_ENABLED) {
  const base = [];
  CONFIG.ORDER.forEach((k) => { for (let i = 0; i < CONFIG.COMPONENTS[k].target; i++) base.push(k); });
  if (withImpurities) for (let i = 0; i < CONFIG.IMPURITIES_PER_GROUP; i++) base.push("IMP");
  return shuffle(base, rand);
}
function applyImpurity(state) {
  const lost = Math.min(CONFIG.PENALTY_IMPURITY, state.score);
  return {
    state: { ...state, score: state.score - lost, penalties: state.penalties + lost, impurities: (state.impurities || 0) + 1 },
    lost,
  };
}
function applyQuiz(quiz, correct) {
  if (quiz.answered) return quiz;
  return { answered: true, correct, bonus: correct ? CONFIG.QUIZ_BONUS : 0 };
}

/* ---------- sonido suave generado localmente ---------- */
const sfx = {
  ctx: null, on: false,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur = 0.12, type = "sine", gain = 0.05, to = null, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  catch_() { this.tone(620, 0.14, "sine", 0.05, 880); },
  extra() { this.tone(260, 0.18, "triangle", 0.035, 200); },
  splash() { this.tone(200, 0.22, "triangle", 0.045, 90); this.tone(120, 0.26, "sine", 0.04, 70, 0.02); },
  done() { this.tone(660, 0.12, "sine", 0.05); this.tone(990, 0.2, "sine", 0.045, null, 0.1); },
  win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.28, "sine", 0.045, null, i * 0.11)); },
  count(last) { this.tone(last ? 880 : 520, 0.1, "sine", 0.035); },
};

/* ---------- piezas visuales ---------- */
function BrandMark({ big = false, md = false } = {}) {
  return CONFIG.LOGO_SRC
    ? html`<span class=${"brand" + (big ? " brand-lg" : md ? " brand-md" : "")}><img src=${CONFIG.LOGO_SRC} alt=${CONFIG.BRAND} /></span>`
    : html`<span class=${"brand" + (big ? " brand-lg" : md ? " brand-md" : "")} role="img" aria-label=${CONFIG.BRAND}><span class="m">MEGA</span><span class="o">OMEGA</span><span class="t">3</span></span>`;
}

function EventMark({ sm = false } = {}) {
  return html`<span class=${"event" + (sm ? " sm" : "")}>
    <img src=${CONFIG.EVENT_LOGO_SRC} alt="Farmashop" />
    <span>${CONFIG.EVENT}</span>
  </span>`;
}

function Claim() {
  const parts = CONFIG.CLAIM.split(/(Mega)/);
  return html`<p class="claim">${parts.map((p, i) => p === "Mega" ? html`<span key=${i} class="hl">${p}</span>` : p)}</p>`;
}

function Chip({ k, size = 52 }) {
  return html`<div class=${"chip " + k} style=${{ width: size, height: size }} aria-label=${`Ficha ${k}`}>

}

function Particles() {
  const dots = useMemo(() => Array.from({ length: 22 }, (_, i) => ({
    left: Math.random() * 100, top: 20 + Math.random() * 100, s: 1 + Math.random() * 2.5,
    d: 18 + Math.random() * 26, delay: -Math.random() * 40, o: 0.15 + Math.random() * 0.35,
  })), []);
  return html`<div class="particles" aria-hidden="true">${dots.map((p, i) => html`<i key=${i} style=${{
    left: p.left + "%", top: p.top + "%", width: p.s, height: p.s, opacity: p.o,
    animationDuration: p.d + "s", animationDelay: p.delay + "s" }}></i>`)}</div>`;

function Territories() {
  if (!CONFIG.SHOW_BENEFIT_TERRITORIES) return null;
  return html`<div class="territories" aria-label="Territorios">
    ${CONFIG.TERRITORIES.map((t) => html`<span class="territory" key=${t}>${Icon[t]}${t}</span>`)}
  </div>`;
}

function Counter({ k, count }) {
  const target = CONFIG.COMPONENTS[k].target;
  const done = count >= target;
  return html`<div class=${`counter ${k} ${done ? "done" : ""}`} role="status" aria-label=${`${k}: ${mgGot(k, count)} de ${mgTotal(k)} ${CONFIG.COMPOSITION.unit}`}>
    <div class="counter-top">
      <span class=${"tag " + k}>${k}</span>
      ${done
        ? html`<span class="done-badge">${Icon.check} COMPLETO</span>`
        : html`<span class="slots">${Array.from({ length: target }, (_, i) => html`<span key=${i} class=${`slot ${k} ${i < count ? "on" : ""}`}></span>`)}</span>`}
    </div>
    <div class="mg">${mgGot(k, count)} <em>/ ${mgTotal(k)} ${CONFIG.COMPOSITION.unit}</em></div>
    <div class=${"bar " + k}><i style=${{ width: (Math.min(count, target) / target) * 100 + "%" }}></i></div>
  </div>`;
}

    <span class="hint-ctrl">${touch ? T.ctrlTouch : html`Mové el mouse o usá <kbd>←</kbd> <kbd>→</kbd>`}</span>
  </div>`;
}

function WinScreen({ data, onNext }) {
  const rm = reducedMotion();
  const flyers = useMemo(() => {
    const ks = CONFIG.ORDER.flatMap((k) => Array(CONFIG.COMPONENTS[k].target).fill(k));
    return ks.map((k, i) => { const a = (i / ks.length) * Math.PI * 2 - Math.PI / 2; return { k, fx: Math.cos(a) * 130 + "px", fy: Math.sin(a) * 110 + "px", delay: i * 0.05 }; });
  }, []);
  const confetti = useMemo(() => rm ? [] : Array.from({ length: 30 }, (_, i) => ({
    cx: (Math.random() - 0.5) * 520 + "px", cy: (Math.random() * 360 - 60) + "px", cr: Math.random() * 720 + "deg",
    c: ["#FFFFFF", "#F7B52A", "#0E2F6E", "#1B54B5"][i % 4], d: 1 + Math.random() * 0.25,
  })), []);
  return html`<div class="screen" style=${{ position: "relative" }}>
    <div class="confetti" aria-hidden="true">${confetti.map((c, i) => html`<i key=${i} style=${{ "--cx": c.cx, "--cy": c.cy, "--cr": c.cr, background: c.c, animationDelay: c.d + "s" }}></i>`)}</div>
    <div class="emblem-stage" aria-hidden="true">
      ${flyers.map((f, i) => html`<div key=${i} class="fly" style=${{ "--fx": f.fx, "--fy": f.fy, animationDelay: f.delay + "s" }}><${Chip} k=${f.k} size=${50} /></div>`)}
      <div class="emblem"><div>
        ${CONFIG.LOGO_SRC ? html`<img class="em-logo" src=${CONFIG.LOGO_SRC} alt=${CONFIG.BRAND} />` : html`<strong>MEGA<em>OMEGA 3</em></strong>`}
        <span><u>${CONFIG.COMPOSITION.DHA}<small>DHA</small></u><i>+</i><u>${CONFIG.COMPOSITION.EPA}<small>EPA</small></u></span>
      </div></div>
    </div>
    <div class="reveal" style=${{ display: "grid", gap: 10, justifyItems: "center", position: "relative" }}>
      <h1 class="h-result">${T.winTitle}</h1>
      <p class="formula"><span class="d">${CONFIG.COMPOSITION.DHA} DHA</span> + <span class="e">${CONFIG.COMPOSITION.EPA} EPA</span></p>
      <p class="note" style=${{ margin: 0 }}>Valores en ${CONFIG.COMPOSITION.unit} por la composición de la marca.</p>
      <${Claim} />
      <div class="score-table">
        <div class="score-row"><span>Capturas válidas (${data.valid} × ${CONFIG.POINTS_CATCH})</span><b>${data.valid * CONFIG.POINTS_CATCH}</b></div>
        <div class="score-row"><span>Descuentos por impurezas</span><b>${data.penalties ? "−" + data.penalties : "0"}</b></div>
        <div class="score-row"><span>Bonus de tiempo (${data.secs} s × ${CONFIG.TIME_BONUS_PER_SEC})</span><b>+${data.bonus}</b></div>
        <div class="score-row sum"><span>Puntaje</span><b>${data.total}</b></div>
      </div>
      <p class="note">${T.timeBonusNote}</p>
      <button class="btn" onClick=${onNext}>PUNTOS EXTRA →</button>
    </div>
  </div>`;
}

function QuizScreen({ base, onReplay }) {
  const options = useMemo(() => shuffle(CONFIG.QUIZ_OPTIONS), []);
  const [quiz, setQuiz] = useState({ answered: false, correct: false, bonus: 0 });
  const [picked, setPicked] = useState(null);
  const final = base + quiz.bonus;

  const answer = (i) => {
    if (quiz.answered) return;
    const next = applyQuiz(quiz, options[i].correct);
    setQuiz(next); setPicked(i);
    if (next.correct) sfx.done(); else sfx.extra();
  };


  return html`<div class="screen">
    <${BrandMark} md />
    <p class="eyebrow">+${CONFIG.QUIZ_BONUS} puntos en juego</p>
    <h1 class="h-result" style=${{ fontSize: "clamp(24px,6.5vw,36px)" }}>${T.quizQ}</h1>
    <div class="quiz" role="group" aria-label="Opciones">
      ${options.map((o, i) => {
        let cls = "opt";
        if (quiz.answered) cls += o.correct ? " right" : i === picked ? " wrong" : " faded";
        return html`<button key=${i} class=${cls} disabled=${quiz.answered} onClick=${() => answer(i)}>
          <span>${o.label}</span>${quiz.answered && o.correct ? Icon.check : null}</button>`;
      })}
    </div>
    ${quiz.answered && html`<div class="reveal" style=${{ animationDelay: "0s", display: "grid", gap: 14, justifyItems: "center" }}>
      <p class="feedback" >${quiz.correct ? `${T.quizRight} +${CONFIG.QUIZ_BONUS}` : T.quizWrong}</p>
      <p class="eyebrow">Puntaje final</p>
      <div class="big-score">${final}</div>
      <${Claim} />
      <${Territories} />
      <button class="btn" onClick=${onReplay}>${T.replay}</button>
      <p class="thanks">${T.thanks}</p>
      <${EventMark} sm />
    </div>`}
  </div>`;
}

function LoseScreen({ data, onRetry }) {
  return html`<div class="screen">
    <${BrandMark} md />
    <h1 class="h-result">${T.loseTitle}</h1>
    <p class="muted" style=${{ margin: 0, fontWeight: 600 }}>Se terminó el tiempo. Esto reuniste:</p>
    <div class="progress-lose">
      ${CONFIG.ORDER.map((k) => html`<${Counter} key=${k} k=${k} count=${data.progress[k]} />`)}
    </div>
    <p class="eyebrow">Objetivo</p>
    <p class="formula"><span class="d">${need("DHA")} DHA</span> + <span class="e">${need("EPA")} EPA</span></p>
    <p class="muted" style=${{ margin: 0 }}>Puntaje: <b style=${{ color: "var(--text)" }}>${data.score}</b></p>
    <${Claim} />
    <button class="btn" onClick=${onRetry} autoFocus>${T.retry}</button>

/* ---------- juego ---------- */
function freshGame() {
  return {
    s: newScoreState(), time: CONFIG.GAME_SECONDS, elapsed: 0,
    chips: [], nextId: 1, spawnIn: 600, bag: [], spawned: 0, lastX: 0.5, shakeUntil: 0,
    basketX: 0.5, keys: { l: false, r: false }, flash: null, floats: [], pop: null, badge: null, freeze: 0, pendingWin: false,
    ended: false, dragging: false,
  };
}

function App() {
  const [phase, setPhase] = useState("welcome");
  const [paused, setPaused] = useState(false);
  const [sound, setSound] = useState(false);
  const [count, setCount] = useState(CONFIG.COUNTDOWN_FROM);
  const [, setFrame] = useState(0);
  const [result, setResult] = useState(null);
  const [runId, setRunId] = useState(0);

  const g = useRef(freshGame());
  const fieldRef = useRef(null);
  const dims = useRef({ w: 360, h: 400 });
  const timers = useRef([]);
  const rafRef = useRef(0);

  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; cancelAnimationFrame(rafRef.current); };
  useEffect(() => clearTimers, []);

  const startGame = useCallback(() => {
    clearTimers();
    sfx.ensure();
    g.current = freshGame();
    setResult(null); setPaused(false); setRunId((r) => r + 1);
    setPhase("countdown");
    const rm = reducedMotion();
    const step = (n) => {
      setCount(n); sfx.count(false);
      if (n > 1) timers.current.push(setTimeout(() => step(n - 1), rm ? 700 : 850));
      else timers.current.push(setTimeout(() => { sfx.count(true); setPhase("play"); }, rm ? 700 : 850));
    };
    step(CONFIG.COUNTDOWN_FROM);
  }, []);

  const endGame = useCallback((win) => {
    const G = g.current;
    if (G.ended) return;           // la partida se cierra una sola vez
    G.ended = true;
    cancelAnimationFrame(rafRef.current);
    G.chips = [];
    if (win) {
      const secs = Math.max(0, Math.floor(G.time));
      const bonus = timeBonus(G.time);
      const total = G.s.score + bonus;
      setResult({ valid: G.s.valid, penalties: G.s.penalties, secs, bonus, total });
      sfx.win();
      setPhase("win");
    } else {
      setResult({ progress: { ...G.s.progress }, score: G.s.score });
      setPhase("lose");
    }
  }, []);

  /* medir campo */
  useEffect(() => {
    const el = fieldRef.current;
    if (!el) return;
    const measure = () => { const r = el.getBoundingClientRect(); dims.current = { w: r.width, h: r.height }; setFrame((f) => f + 1); };
    measure();
    const ro = new ResizeObserver(measure); ro.observe(el);
    return () => ro.disconnect();
  }, [phase === "play" || phase === "countdown", runId]);

  /* geometría */
  const geo = () => {
    const { w, h } = dims.current;
    const bw = w * CONFIG.BASKET_WIDTH;
    const bh = bw / 2.3881;  // proporción de la cápsula
    const r = clamp(w * 0.07, 23, 33);
    const top = h - 16 - bh;
    return { w, h, bw, bh, r, top, catchY: top + bh * 0.15 };
  };

  const spawn = () => {
    const G = g.current, { w, r } = geo();
    const easy = G.spawned < CONFIG.EASY_CHIPS;
    if (!G.bag.length) G.bag = makeBag();
    // las primeras fichas nunca son impurezas: se toma el primer componente del grupo
    let idx = 0;
    if (easy) { idx = G.bag.findIndex((x) => x !== "IMP"); if (idx < 0) { G.bag = makeBag(); idx = G.bag.findIndex((x) => x !== "IMP"); } }
    const k = G.bag.splice(idx, 1)[0];
    const m = r / w + 0.02;
    let lo = easy ? 0.28 : m, hi = easy ? 0.72 : 1 - m, x = 0.5;
    for (let i = 0; i < 12; i++) { x = lo + Math.random() * (hi - lo); if (Math.abs(x - G.lastX) >= (easy ? 0.12 : CONFIG.MIN_SPAWN_GAP)) break; }
    if (easy && G.spawned === 0) x = 0.5 + (Math.random() - 0.5) * 0.2;
    const prog = smooth(clamp(G.elapsed / CONFIG.GAME_SECONDS, 0, 1));
    const fall = easy ? CONFIG.FALL_START_S : CONFIG.FALL_START_S - (CONFIG.FALL_START_S - CONFIG.FALL_END_S) * prog;
    G.chips.push({ id: G.nextId++, k, x, y: -r, fall, state: "fall", checked: false, t: 0, rot: 0 });
    G.lastX = x; G.spawned++;
    const spread = CONFIG.SPAWN_MAX_MS - CONFIG.SPAWN_MIN_MS;
    G.spawnIn = easy ? CONFIG.SPAWN_MAX_MS : CONFIG.SPAWN_MIN_MS + spread * Math.random() * (1 - 0.35 * prog);
  };

  const step = (dt) => {
    const G = g.current, { w, h, bw, bh, r, top, catchY } = geo();
    // el juego se detiene mientras se lee el cartel de componente completo
    if (G.freeze > 0 || G.pendingWin) {
      G.freeze -= dt;
      if (G.badge) {
        G.badge.left -= dt;
        if (G.badge.left <= 0) {
          const wasFinal = G.badge.k === "FINAL";
          G.badge = null;
          if (G.pendingWin && !wasFinal) {
            // primero el cartel del componente, después el de la fórmula completa
            G.badge = { k: "FINAL", id: "final", left: CONFIG.FINAL_BADGE_SECONDS };
            G.freeze = CONFIG.FINAL_BADGE_SECONDS;
            sfx.done();
            return;
          }
          if (G.pendingWin) { endGame(true); return; }
        }
      } else if (G.pendingWin) { endGame(true); return; }
      return;
    }
    G.time -= dt; G.elapsed += dt;
    if (G.time <= 0) { G.time = 0; endGame(false); return; }

    // teclado
    const dir = (G.keys.r ? 1 : 0) - (G.keys.l ? 1 : 0);
    if (dir) G.basketX += dir * CONFIG.KEY_SPEED * dt;
    const half = CONFIG.BASKET_WIDTH / 2;
    G.basketX = clamp(G.basketX, half, 1 - half);
    const bx = G.basketX * w;

    G.spawnIn -= dt * 1000;
    if (G.spawnIn <= 0) spawn();

    const keep = [];
    for (const c of G.chips) {
      c.t += dt;
      if (c.state === "fall") {
        const prevY = c.y;
        c.y += ((h + 2 * r) / c.fall) * dt;
        if (!c.checked && prevY < catchY && c.y >= catchY) {
          c.checked = true;
          const cx = c.x * w;
          // las impurezas solo cuentan si caen sobre la parte central de la cápsula (un roce lateral no penaliza)
          const reach = c.k === "IMP" ? bw * 0.3 : bw / 2 + r * 0.25;
          if (Math.abs(cx - bx) <= reach) {
            if (c.k === "IMP") {
              const b = applyImpurity(G.s);
              G.s = b.state;
              c.state = "splash"; c.t = 0; c.px = cx; c.py = c.y;
              G.shakeUntil = G.elapsed + 0.4;
              G.flash = { txt: T.impurity(b.lost), until: G.elapsed + 1.3, kind: "imp" };
              if (b.lost) G.floats.push({ id: c.id, x: cx, y: top - 10, txt: "−" + b.lost, k: "x", until: G.elapsed + 0.9 });
              sfx.splash();
              keep.push(c);
              continue;
            }
            const res = applyCatch(G.s, c.k);
            G.s = res.state;
            if (res.result === "valid") {
              c.state = "absorb"; c.t = 0; c.fromX = cx; c.fromY = c.y;
              G.pop = { id: c.id, k: c.k };
              G.floats.push({ id: c.id, x: cx, y: top - 10, txt: "+" + CONFIG.POINTS_CATCH, k: c.k, until: G.elapsed + 0.8 });
              if (res.justDone) {
                sfx.done();
                G.badge = { k: c.k, id: c.id, left: CONFIG.BADGE_SECONDS };
                G.freeze = CONFIG.BADGE_FREEZE_S;
                // si con esta ficha se completó todo, el cartel se muestra igual antes de la victoria
                if (isComplete(G.s)) { G.pendingWin = true; G.freeze = CONFIG.BADGE_SECONDS; return; }
              } else sfx.catch_();
              if (isComplete(G.s)) { endGame(true); return; }
            } else {
              c.state = "bounce"; c.t = 0; c.px = cx; c.py = c.y;
              const out = cx < bx ? -1 : 1;
              c.vx = out * (220 + Math.random() * 80); c.vy = -520;
              G.flash = { txt: T.extra, until: G.elapsed + 1.3 };
              if (res.lost) G.floats.push({ id: c.id, x: cx, y: top - 10, txt: "−" + res.lost, k: "x", until: G.elapsed + 0.8 });
              sfx.extra();
            }
          }
        }
        if (c.y - r > h) continue;
        keep.push(c);
      } else if (c.state === "absorb") {
        if (c.t < 0.28) keep.push(c);
      } else if (c.state === "splash") {
        if (c.t < 0.5) keep.push(c);
      } else if (c.state === "bounce") {
        c.vy += 1500 * dt; c.px += c.vx * dt; c.py += c.vy * dt; c.rot += c.vx * dt * 1.2;
        if (c.t < 1.4 && c.py - r < h && c.px > -r * 2 && c.px < w + r * 2) keep.push(c);
      }
    }
    G.chips = keep;
    G.floats = G.floats.filter((f) => f.until > G.elapsed);
    if (G.flash && G.flash.until < G.elapsed) G.flash = null;
    if (G.badge) { G.badge.left -= dt; if (G.badge.left <= 0) G.badge = null; }
  };

  /* bucle principal */
  useEffect(() => {
    if (phase !== "play" || paused) return;
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      step(dt);
      if (!g.current.ended) { setFrame((f) => (f + 1) % 1e6); rafRef.current = requestAnimationFrame(loop); }
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [phase, paused, runId]);

  /* pausa por visibilidad */
  useEffect(() => {
    const onVis = () => { if (document.hidden && phase === "play") setPaused(true); };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, [phase]);

  /* teclado */
  useEffect(() => {
    const down = (e) => {
      if (phase !== "play") return;
      if (e.key === "ArrowLeft" || e.key === "a") { g.current.keys.l = true; e.preventDefault(); }
      if (e.key === "ArrowRight" || e.key === "d") { g.current.keys.r = true; e.preventDefault(); }
      if (e.key === "p" || e.key === "P" || e.key === "Escape") setPaused((p) => !p);
    };
    const up = (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") g.current.keys.l = false;
      if (e.key === "ArrowRight" || e.key === "d") g.current.keys.r = false;
    };
    window.addEventListener("keydown", down); window.addEventListener("keyup", up);
    return () => { window.removeEventListener("keydown", down); window.removeEventListener("keyup", up); };
  }, [phase]);

  /* puntero: mouse sigue; táctil arrastra */
  const setFromPointer = (e) => {
    const el = fieldRef.current; if (!el) return;
    const rect = el.getBoundingClientRect();
    const half = CONFIG.BASKET_WIDTH / 2;
    g.current.basketX = clamp((e.clientX - rect.left) / rect.width, half, 1 - half);
  };
  const onPointerDown = (e) => {
    if (phase !== "play" || paused) return;
    g.current.dragging = true;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    setFromPointer(e); e.preventDefault();
  };
  const onPointerMove = (e) => {
    if (phase !== "play" || paused) return;
    if (e.pointerType === "mouse" || g.current.dragging) setFromPointer(e);
  };
  const onPointerUp = () => { g.current.dragging = false; };

  const toggleSound = () => { sfx.ensure(); sfx.on = !sound; setSound(!sound); if (!sound) sfx.tone(700, 0.1, "sine", 0.04); };
  const togglePause = () => { g.current.keys = { l: false, r: false }; setPaused((p) => !p); };

  const inGame = phase === "play" || phase === "countdown";
  const G = g.current;
  const gm = geo();
  const low = phase === "play" && G.time <= CONFIG.LOW_TIME_SECONDS;

  let guide;
  const dDone = isDone(G.s, "DHA"), eDone = isDone(G.s, "EPA");
  const left = (k) => CONFIG.COMPONENTS[k].target - G.s.progress[k];
  if (!dDone && !eDone) guide = html`Atrapá <span class="DHA-t">${left("DHA")} DHA</span> y <span class="EPA-t">${left("EPA")} EPA</span>`;
  else if (dDone && !eDone) guide = html`¡Ahora completá <span class="EPA-t">EPA</span>! Falta${left("EPA") > 1 ? "n" : ""} ${left("EPA")}`;
  else if (eDone && !dDone) guide = html`¡Ahora completá <span class="DHA-t">DHA</span>! Falta${left("DHA") > 1 ? "n" : ""} ${left("DHA")}`;
  else guide = "¡Fórmula completa!";

  const filled = G.s.progress.DHA + G.s.progress.EPA;
  const totalChips = CONFIG.ORDER.reduce((s, k) => s + CONFIG.COMPONENTS[k].target, 0);

  return html`<div class=${"app" + (inGame ? " playing" : "")}>
    <${Particles} />
    <div class="shell">
      ${phase === "welcome" && html`<${Welcome} onStart=${startGame} />`}
      ${phase === "win" && result && html`<${WinScreen} key=${"w" + runId} data=${result} onNext=${() => setPhase("quiz")} />`}
      ${phase === "quiz" && result && html`<${QuizScreen} key=${"q" + runId} base=${result.total} onReplay=${startGame} />`}
      ${phase === "lose" && result && html`<${LoseScreen} data=${result} onRetry=${startGame} />`}

      ${inGame && html`
        <div class="hud">
          <${BrandMark} />
          <div class="hud-actions">
            <button class="icon-btn" onClick=${togglePause} disabled=${phase !== "play"} aria-label=${paused ? "Continuar" : "Pausa"}>${paused ? Icon.play : Icon.pause}</button>
            <button class="icon-btn" onClick=${toggleSound} aria-pressed=${sound} aria-label=${sound ? "Desactivar sonido" : "Activar sonido"}>${sound ? Icon.soundOn : Icon.soundOff}</button>
          </div>
        </div>
        <div class="stats">
          <div class=${"stat" + (low ? " low" : "")}><span>Tiempo</span><strong aria-live="off">${Math.ceil(G.time)}<small style=${{ fontSize: 14 }}> s</small></strong></div>
          <div class="stat"><span>Puntos</span><strong>${G.s.score}</strong></div>
        </div>
        <div class="counters">${CONFIG.ORDER.map((k) => html`<${Counter} key=${k} k=${k} count=${G.s.progress[k]} />`)}</div>

        <div class="field" ref=${fieldRef}
          onPointerDown=${onPointerDown} onPointerMove=${onPointerMove} onPointerUp=${onPointerUp} onPointerCancel=${onPointerUp}
          onContextMenu=${(e) => e.preventDefault()} aria-label="Campo de juego">
          ${G.chips.map((c) => {
            let x, y, sc = 1, rot = 0, op = 1;
            if (c.state === "fall") { x = c.x * gm.w; y = c.y; }
            else if (c.state === "absorb") {
              const p = clamp(c.t / 0.28, 0, 1);
              x = c.fromX + (G.basketX * gm.w - c.fromX) * p; y = c.fromY + (gm.top + gm.bh * 0.5 - c.fromY) * p; sc = 1 - 0.7 * p; op = 1 - p * 0.6;
            } else if (c.state === "splash") {
              return html`<div key=${c.id} class="ent" style=${{ transform: `translate(${c.px - gm.r * 1.6}px, ${c.py - gm.r * 1.6}px)` }}>
                <div class="splash" style=${{ width: gm.r * 3.2, height: gm.r * 3.2 }}></div>
              </div>`;
            } else { x = c.px; y = c.py; rot = c.rot; op = Math.max(0, 1 - c.t / 1.4); }
            return html`<div key=${c.id} class="ent" style=${{ transform: `translate(${x - gm.r}px, ${y - gm.r}px) rotate(${rot}deg) scale(${sc})`, opacity: op }}>
              ${c.k === "IMP" ? html`<${Impurity} size=${gm.r * 2} />` : html`<${Chip} k=${c.k} size=${gm.r * 2} />`}
            </div>`;
          })}

          <div class="basket" style=${{ width: gm.bw, height: gm.bh, transform: `translateX(${G.basketX * gm.w - gm.bw / 2}px)` }}>
            <div class=${"capsule" + (G.shakeUntil > G.elapsed ? " shake" : "")}>
              <img class="cap-empty" src=${CAPSULE_SRC} alt="" draggable="false" />
              <div class="cap-fill" style=${{ clipPath: `inset(0 ${100 - (filled / totalChips) * 100}% 0 0 round 999px)` }}>
                <img src=${CAPSULE_SRC} alt="" draggable="false" />
              </div>
              <div class="cap-outline"></div>
            </div>
            ${G.pop && html`<div key=${G.pop.id} class="basket-pop" style=${{ "--pop": CONFIG.COLORS[G.pop.k] }}></div>`}
          </div>

          ${G.floats.map((f) => html`<div key=${"f" + f.id} class="float-pts" style=${{ left: clamp(f.x - 20, 6, gm.w - 90), top: f.y - 20, color: f.k === "x" ? "#0E2F6E" : "#FFFFFF" }}>${f.txt}</div>`)}
          ${G.badge && (() => {
            const isFinal = G.badge.k === "FINAL";
            const cfg = isFinal ? CONFIG.FINAL_BADGE : CONFIG.COMPLETE_BADGE[G.badge.k];
            return html`<div key=${"b" + G.badge.id} class=${"badge-pop" + (isFinal ? " big" : "")} role="status"
              style=${{ animationDuration: (isFinal ? CONFIG.FINAL_BADGE_SECONDS : CONFIG.BADGE_SECONDS) + "s" }}>
              <div class="bp-chip">
                ${isFinal ? html`<img src=${CAPSULE_SRC} alt="" />` : html`<${Chip} k=${G.badge.k} size=${64} />`}
              </div>
              <div class="bp-body">
                <span class="bp-title">${cfg.title}</span>
                ${cfg.claim && html`<span class="bp-claim">${cfg.claim}</span>`}
                ${cfg.footnote && html`<span class="bp-foot">${cfg.footnote}</span>`}
              </div>
              ${cfg.icon === "brain" && html`<div class="bp-icon"><img src=${BRAIN_SRC} alt="" /></div>`}
              ${cfg.icon === "muscle" && html`<div class="bp-icon bp-icon-svg">${Icon.Músculo}</div>`}
              ${cfg.icon === "heart" && html`<div class="bp-icon bp-heart"><img src=${HEART_SRC} alt="" /></div>`}
              <div class="bp-edge"></div>
            </div>`;
          })()}
          ${G.freeze > 0 && html`<div class="freeze-tint"></div>`}
          ${G.flash && html`<div class=${"toast" + (G.flash.kind === "imp" ? " toast-imp" : "")} role="status">${G.flash.txt}</div>`}

          ${phase === "countdown" && html`<div class="overlay"><div>
            <div key=${count} class="count">${count}</div>
            <p class="lead">${isTouch() ? T.ctrlTouch : T.ctrlDesktop}</p>
          </div></div>`}
          ${phase === "play" && paused && html`<div class="overlay" onPointerDown=${(e) => e.stopPropagation()}><div class="pause-card">
            <h2>Pausa</h2>
            <p class="muted" style=${{ margin: 0 }}>El tiempo y las fichas están detenidos.</p>
            <button class="btn" onClick=${togglePause} autoFocus>CONTINUAR</button>
            <button class="btn ghost" onClick=${startGame}>REINICIAR</button>
          </div></div>`}
        </div>
        <div class="guide" aria-live="polite">${guide}</div>
      `}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>

</body></html>
</body>
</html>
